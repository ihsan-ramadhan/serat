# flatpak-builder --user --install --force-clean build-flatpak packaging/flatpak/id.icqn.Serat.yml
app-id: id.icqn.Serat
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: serat
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Vaults are ordinary folders that other apps change too; Serat watches them, so it needs the folders themselves.
  - --filesystem=home
modules:
  - name: md4c
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_MD2HTML_EXECUTABLE=OFF
    sources:
      - type: archive
        url: https://github.com/mity/md4c/archive/refs/tags/release-0.5.2.tar.gz
        sha256: 55d0111d48fb11883aaee91465e642b8b640775a4d6993c2d0e7a8092758ef21
  - name: serat
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: ../..
