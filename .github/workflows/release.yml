name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04 # the oldest glibc still supported, so the AppImage runs on more systems
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libfontconfig1 libhunspell-dev pkg-config libfuse2
      - name: Build AppImage
        run: packaging/appimage.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/Serat-*.AppImage

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build
      - name: Package
        run: cpack --config build/CPackConfig.cmake -G "NSIS;ZIP" -B build/packages
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/packages/*.exe
            build/packages/*.zip

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Install packages
        run: brew install ninja hunspell pkg-config
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build
      - name: Package
        run: cpack --config build/CPackConfig.cmake -G DragNDrop -B build/packages
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/packages/*.dmg

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
